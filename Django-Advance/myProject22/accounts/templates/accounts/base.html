<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Django File Ipload demo</title>
</head>
<body>
    <a href="{% url 'upload_profile' %}"> Upload Profile Picture</a> |
    <a href="{% url 'view_profile' %}"> View Profile Picture</a>"

    <hr>
    {% if messages %}
      <ul>
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
